name: exact SHA full safety gate

on:
  push:
    branches: [main, remediation/**, integration/**]
  pull_request:
  workflow_dispatch:

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record exact revision
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Go format check
        shell: bash
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Go tests, race detector and vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Frontend typecheck, unit tests and production build
        run: |
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Browser interaction and responsive tests
        run: |
          npx playwright install --with-deps chromium
          npm run browser:test

      - name: Build reproducible OpenWrt artifacts
        run: sh scripts/build-go.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'
          # Only lint repository-owned shell sources. Toolchains, generated
          # artifacts, and local fixtures are excluded just like run-all.ps1;
          # excluding them prevents vendored Go scripts from becoming CI
          # failures while leaving every tracked project script in scope.
          ignore_paths: "node_modules .tools dist .local .git"
          severity: warning

      - name: Installer, adapter and recovery fixtures
        run: |
          run_fixture() {
            fixture="$1"
            shift
            if "$@"; then
              return 0
            fi
            echo "::error title=fixture failure::${fixture}"
            return 1
          }
          run_fixture package-openwrt sh tests/package-openwrt.sh
          run_fixture installer-backup sh tests/installer-backup.sh
          run_fixture installer-disk-preflight sh tests/installer-disk-preflight.sh
          run_fixture installer-durability sh tests/installer-durability.sh
          run_fixture installer-lifecycle sh tests/installer-lifecycle.sh
          run_fixture installer-prefix-switch sh tests/installer-prefix-switch.sh
          run_fixture content-aware-install sh tests/content-aware-install.sh
          run_fixture shell-library sh tests/shell-library.sh
          run_fixture dns-observer-bootstrap sh tests/dns-observer-bootstrap.sh
          run_fixture boot-guard-service sh tests/boot-guard-service.sh
          run_fixture controller-bind-safety sh tests/controller-bind-safety.sh
          run_fixture boot-guard-policy sh tests/boot-guard-policy.sh
          run_fixture helper-service sh tests/helper-service.sh
          run_fixture hotplug-bounded sh tests/hotplug-bounded.sh
          run_fixture adapter-rollback sh tests/adapter-rollback.sh
          run_fixture openwrt-adapter-integration sh tests/openwrt-adapter-integration.sh

      - name: Zapret ownership and cleanup fixtures
        run: |
          sh tests/zapret-calibration-runtime.sh
          sudo sh tests/zapret-quick-contract.sh

      - name: Linux namespace nft transition gate
        run: sudo sh tests/nft-transition-namespace.sh

      - name: Secret and forbidden-pattern scan
        run: |
          sh tests/secret-scan.sh
          git diff --check

      - name: Upload exact-SHA evidence manifest
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "workflow_sha=${{ github.sha }}"
            echo "runner=$(uname -a)"
            echo "go=$(go version)"
            echo "node=$(node --version)"
          } > evidence/full-gate.env
          sha256sum evidence/full-gate.env > evidence/full-gate.env.sha256
      - name: Publish gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flintroute-full-gate-${{ github.sha }}
          path: evidence/
