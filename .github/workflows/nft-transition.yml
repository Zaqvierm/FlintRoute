name: nft transition safety

on:
  push:
    branches: [main, remediation/**]
  pull_request:

jobs:
  namespace-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install namespace test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iproute2 nftables iputils-ping
      - name: Run atomic nft transition harness
        run: sudo bash tests/nft-transition-namespace.sh
